<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FeedMe Prototype - Cart</title>
  <link rel="stylesheet" href="./css/style.css" />
  <!-- Firebase SDK (cloud database for HD criterion) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="./js/lib/firebase-config.js"></script>
</head>
<body>
  <header class="header">
    <h1>Feed<span class="brand-accent">Me</span></h1>
    <p class="sub">Review your order</p>
  </header>

  <main class="container">
    <nav class="nav-bar">
      <a href="./index.html">🏠 Home</a>
      <a href="./cart.html" class="active">🛒 Cart</a>
      <a href="./my-orders.html">📦 My Orders</a>
      <a href="./restaurant-orders.html">📋 Restaurant Portal</a>
      <a href="./manage-menu.html">✏️ Manage Menu</a>
      <a href="./driver.html">🚗 Driver Portal</a>
    </nav>
    <section style="margin-top: 14px;">
      <h2>Your Cart</h2>
      <div id="status" class="status"></div>
      <div id="cartList"></div>

      <div id="cartFooter" style="display:none; margin-top:20px;">
        <div id="cartTotal" style="font-size:1.2rem; font-weight:bold; margin-bottom:14px;"></div>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <a class="btn btn-primary" href="./checkout.html">Checkout →</a>
          <button id="clearBtn" class="btn btn-danger" type="button">Clear cart</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    FeedMe &copy; 2026 — CP3407 Advanced Software Engineering
  </footer>

  <script src="./js/cart.js"></script>
</body>
</html>
